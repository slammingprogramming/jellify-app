name: Run Jest Unit Tests
on:
  push:
    branches-ignore:
      - "main"


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-jest-test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🖥 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Do not cache ~/.bun/install/cache here: bun hard-links packages from it into node_modules,
      # and patch-package edits those files in place, so the cache ends up holding already-patched
      # packages and later fresh installs fail to apply the patches. The key is also new on purpose,
      # so the polluted entry saved under the old "-bun-" key is never restored.
      - name: 📦 Jest cache
        uses: actions/cache@v6
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-jest-

      - name: 📦 Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/bun.lock', 'patches/**') }}

      - name: 🍞 Run `bun i`
        run: bun i

      - name: 🔍 Run tsc
        run: bun tsc

      - name: 🧪 Run test
        run: CI=true bun run test

      - name: 🦋 Check Styling
        run: bun run format:check
