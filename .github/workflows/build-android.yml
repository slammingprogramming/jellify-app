name: Build Android APK
on:
  push:
    branches: [main, claude/admiring-mccarthy-m27kgj] # TEMP: remove after testing
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - 'maestro/**'
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      all-abis:
        description: 'Build every CPU architecture (slow). Default is arm64 only, which covers all modern phones.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # Android builds do not need macOS, and Linux minutes are 10x cheaper on private repos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🖥 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 💬 Echo package.json version to Github ENV
        run: echo VERSION_NUMBER=$(bun -p "require('./package.json').version") >> $GITHUB_ENV

      - name: 🔑 Decode and setup release keystore
        env:
          ANDROID_SIGNING_BASE64: ${{ secrets.ANDROID_SIGNING_BASE64 }}
        run: |
          if [ -n "$ANDROID_SIGNING_BASE64" ]; then
            echo "$ANDROID_SIGNING_BASE64" | base64 --decode > android/app/jellify.keystore
            echo "Release keystore created"
          else
            echo "No keystore secret found, the APK will be signed with the debug keystore"
          fi

      - name: 🤖 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚀 Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ABIS: ${{ inputs.all-abis && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema assembleRelease \
            -PreactNativeArchitectures="$ABIS" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: jellify-android-${{ env.VERSION_NUMBER }}-run${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
