name: Build iOS IPA
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - 'maestro/**'
      - 'android/**'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 🔎 Skip if this exact content was already built
        id: skip
        uses: ./.github/actions/skip-if-built
        with:
          workflow-file: build-ios.yml
          token: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🖥 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: 💬 Echo package.json version to Github ENV
        run: echo VERSION_NUMBER=$(bun -p "require('./package.json').version") >> $GITHUB_ENV

      - name: 🍎 Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: 🍎 Install dependencies and pods
        run: bun run init-ios:new-arch

      # The project is configured to sign with the original maintainer's Apple team, which cannot
      # work here. Build unsigned: AltStore / Sideloadly re-sign the .ipa with your own Apple ID.
      - name: 🚀 Build unsigned app for iOS devices
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace Jellify.xcworkspace \
            -scheme 'Jellify - Release' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # Catch an app that cannot launch before it is shipped, and print what was built so a launch
      # crash on a device can be diagnosed from this log.
      - name: 🔎 Inspect built app
        run: |
          cd ios/build/Build/Products/Release-iphoneos/Jellify.app
          ls -la
          echo "--- Frameworks"; ls Frameworks 2>/dev/null || echo "(none)"
          echo "--- Info.plist"; plutil -p Info.plist | grep -E "CFBundle(Identifier|Executable|ShortVersionString|Version)\"|MinimumOSVersion|DTSDKName|DTXcode\"|UIDeviceFamily|RCTNewArchEnabled" || true
          echo "--- Executable"; lipo -archs Jellify; vtool -show-build Jellify | grep -E "platform|minos|sdk" || true
          echo "--- Signature"; codesign -dv . 2>&1 || true

          if [ ! -s main.jsbundle ]; then
            echo "::error::main.jsbundle is missing from the app, it would crash on launch"
            exit 1
          fi
          ls -la main.jsbundle

          # Frameworks the app links by @rpath must be embedded, or dyld aborts the launch. The Swift
          # runtime (libswift*) is also linked by @rpath but is provided by the OS, so skip it.
          # Warn only: this is a diagnostic, the missing JS bundle above is the certain failure.
          for lib in $(otool -L Jellify | awk '/@rpath\//{print $1}' | sed 's#@rpath/##' | grep -v '^libswift'); do
            if [ ! -e "Frameworks/$lib" ]; then
              echo "::warning::linked by @rpath but not embedded in the app: $lib"
            fi
          done
          echo "--- Linked libraries"; otool -L Jellify | sed 1d

      - name: 📦 Package unsigned .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          ls
          rm -rf Payload && mkdir Payload
          cp -R Jellify.app Payload/
          zip -qry Jellify-unsigned.ipa Payload

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: jellify-ios-unsigned-${{ env.VERSION_NUMBER }}-run${{ github.run_number }}
          path: ios/build/Build/Products/Release-iphoneos/Jellify-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
