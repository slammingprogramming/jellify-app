name: Build iOS IPA
on:
  push:
    branches: [main, claude/admiring-mccarthy-m27kgj] # TEMP: remove after testing
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - 'maestro/**'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🖥 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: 💬 Echo package.json version to Github ENV
        run: echo VERSION_NUMBER=$(bun -p "require('./package.json').version") >> $GITHUB_ENV

      - name: 🍎 Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: 🍎 Install dependencies and pods
        run: bun run init-ios:new-arch

      # The project is configured to sign with the original maintainer's Apple team, which cannot
      # work here. Build unsigned: AltStore / Sideloadly re-sign the .ipa with your own Apple ID.
      - name: 🚀 Build unsigned app for iOS devices
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace Jellify.xcworkspace \
            -scheme 'Jellify - Release' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 📦 Package unsigned .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          ls
          rm -rf Payload && mkdir Payload
          cp -R Jellify.app Payload/
          zip -qry Jellify-unsigned.ipa Payload

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: jellify-ios-unsigned-${{ env.VERSION_NUMBER }}-run${{ github.run_number }}
          path: ios/build/Build/Products/Release-iphoneos/Jellify-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
