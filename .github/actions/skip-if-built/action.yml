name: Skip if already built
description: >
  Sets `skip=true` when this exact repository content (the Git tree, not the commit) was already
  built successfully by the same workflow recently, so identical code is never built twice, e.g.
  when a branch that already built is merged or pushed to main. Manual runs always build.
inputs:
  workflow-file:
    description: 'File name of the workflow to look for earlier successful runs of'
    required: true
  token:
    description: 'GitHub token with `actions: read`'
    required: true
  max-age-days:
    description: 'Ignore earlier runs older than this, so their artifacts have not expired'
    required: false
    default: '13'
outputs:
  skip:
    description: "'true' when an earlier successful run built identical content"
    value: ${{ steps.check.outputs.skip }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WORKFLOW: ${{ inputs.workflow-file }}
        MAX_AGE_DAYS: ${{ inputs.max-age-days }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail

        if [ "$EVENT" = "workflow_dispatch" ]; then
          echo "Manual run, always building"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Pull request runs check out a synthetic merge commit; the content that gets built
        # and recorded is the PR head (the second parent). Everything else builds HEAD.
        if [ "$EVENT" = "pull_request" ] && git rev-parse --verify -q 'HEAD^2' >/dev/null; then
          TREE=$(git rev-parse 'HEAD^2^{tree}')
        else
          TREE=$(git rev-parse 'HEAD^{tree}')
        fi
        echo "Content hash (git tree): $TREE"

        MATCH=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?status=success&per_page=100" \
          --jq "[.workflow_runs[]
                 | select(.head_commit.tree_id == \"$TREE\")
                 | select(.created_at > ((now - $MAX_AGE_DAYS * 86400) | todate))
                 | select(.id != ($GITHUB_RUN_ID | tonumber))][0].html_url // empty")

        if [ -n "$MATCH" ]; then
          echo "::notice title=Build skipped::Identical content was already built successfully: $MATCH"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
